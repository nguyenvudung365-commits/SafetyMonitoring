# CONFIG DEMO cho clip 13002132 - vùng cấm giả định (khu vật liệu bên phải). Không phải vùng thật.
# Mọi ngưỡng đọc từ file này, không hard-code trong .py

zones:
  # Đa giác vùng cấm trong hệ toạ độ ảnh (0-1 chuẩn hoá)
  # Ví dụ: khu vực cần cẩu
  forbidden:
    - name: "demo_stockpile_zone"
      polygon: [[0.65, 0.55], [1.0, 0.55], [1.0, 1.0], [0.65, 1.0]]

thresholds:
  machinery_k: 0.5         # ngưỡng máy móc = k * chiều cao bbox người, đo từ chân tới CẠNH bbox máy
  cabin_overlap: 0.8       # bbox người nằm >= 80% trong bbox máy -> coi là ngồi trong cabin, bỏ qua
  ppe_conf: 0.50
  zone_person_conf: 0.50   # person conf tối thiểu cho luật vùng cấm (loại móc cẩu conf 0.27-0.32)
  dedup_iou: 0.20          # gộp sự kiện khi tracker đổi id: bbox chồng >= 0.2 với người đã báo
  fall_conf: 0.70

temporal:
  ppe_frames: 15        # N cho PPE/vùng/máy (~0.5s @30fps)
  fall_frames: 8        # N cho té ngã (~0.27s)
  dedup_sec: 3          # cửa sổ gộp sự kiện khi đổi id
  cooldown_sec: 60      # không báo lại cùng (ID, loại) trong 60s
  window_size: 30       # cửa sổ TCN

classes:
  names: ["person", "helmet", "no_helmet", "vest", "no_vest", "machinery"]
